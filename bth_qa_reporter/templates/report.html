<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%REPORT_TITLE%% - BTH QA Report - %%RUN_NAME%%</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#202124;background:#f4f6f9}
*{box-sizing:border-box}body{margin:0}.header{background:#172033;color:#fff;padding:28px 38px}.header h1{margin:0 0 6px;font-size:27px}.header p{margin:0;opacity:.8}.container{max-width:1450px;margin:24px auto;padding:0 20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0000000d}.muted{color:#6b7280}.num{font-size:30px;font-weight:700}.pass{color:#16803c}.fail{color:#c62828}.skip{color:#9a6700}.toolbar{margin:18px 0;background:#fff;padding:14px;border-radius:12px;display:flex;gap:10px}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #d7dce2;border-radius:8px}.toolbar input{flex:1}.test{background:#fff;margin:12px 0;border-radius:10px;border:1px solid #e2e6eb;overflow:hidden}.test-head{padding:15px 18px;display:flex;justify-content:space-between;cursor:pointer}.test-body{display:none;border-top:1px solid #e8ebef;padding:18px}.test.open .test-body{display:block}.badge{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.badge.pass{background:#e8f5ed}.badge.fail{background:#fdecec}.badge.skip{background:#fff6db}.step{border:1px solid #e2e6eb;border-radius:8px;margin:9px 0;overflow:hidden}.step-head{padding:10px 12px;display:flex;justify-content:space-between}.step-body{padding:12px;background:#fafbfc}.validation-title{font-weight:600;margin-bottom:8px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb;font-size:13px}th{background:#f3f5f7}.screenshot{max-width:100%;border:1px solid #ddd;border-radius:6px}error{white-space:pre-wrap;background:#fff1f1;padding:12px;border-radius:8px;color:#9b1c1c;font-size:12px}.metadata{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.meta{background:#f7f8fa;border-radius:8px;padding:10px}.meta b{display:block;font-size:11px;color:#6b7280;margin-bottom:3px}@media(max-width:800px){.cards,.metadata{grid-template-columns:repeat(2,1fr)}}
.logs{margin:14px 0;background:#f7f8fa;border:1px solid #e2e6eb;border-radius:8px;padding:12px}
.step-body>div{white-space:pre-line}
.logs h3{margin:0 0 10px;font-size:15px}
.log-line{font-family:Consolas,Monaco,monospace;font-size:12px;padding:7px 9px;border-bottom:1px solid #e5e7eb;white-space:pre-wrap;word-break:break-word}
.log-line:last-child{border-bottom:0}
.log-level{font-weight:700}
</style></head>
<body>
<div class="header"><h1>%%REPORT_TITLE%%</h1><p>%%REPORT_SUBTITLE%%</p></div>
<div class="container">
<div class="cards"><div class="card"><div class="muted">Total Tests</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">Passed</div><div class="num pass" id="passed">0</div></div><div class="card"><div class="muted">Failed</div><div class="num fail" id="failed">0</div></div><div class="card"><div class="muted">Pass Rate</div><div class="num" id="rate">0%</div></div></div>
<div id="tests"></div></div>
<script>
const DATA=%%TEST_DATA%%;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cls(s){return s==='passed'||s==='PASS'?'pass':s==='failed'||s==='FAIL'?'fail':s==='skipped'?'skip':''}
function stepHtml(s){let body='';if(s.details){try{const d=JSON.parse(s.details);if(d.rows){body='<div class="validation-title">Cell-by-cell comparison</div><table><tr><th>Column</th><th>Expected</th><th>Actual</th><th>Status</th></tr>'+d.rows.map(r=>`<tr><td>${esc(r.column)}</td><td>${esc(r.expected)}</td><td>${esc(r.actual)}</td><td class="${cls(r.status)}"><b>${esc(r.status)}</b></td></tr>`).join('')+'</table>'}else body='<div>'+esc(s.details)+'</div>'}catch(e){body='<div>'+esc(s.details)+'</div>'}}
if(s.expected!==null&&s.expected!==undefined) body+=`<table><tr><th>Expected</th><th>Actual</th><th>Status</th></tr><tr><td>${esc(s.expected)}</td><td>${esc(s.actual)}</td><td class="${s.status==='PASS'?'pass':'fail'}"><b>${esc(s.status)}</b></td></tr></table>`;
if(s.screenshot) body+=`<div style="margin-top:12px"><div class="muted" style="font-weight:600;margin-bottom:6px">Failure Screenshot</div><img class="screenshot" src="${esc(s.screenshot)}" alt="Failure Screenshot"></div>`;
return `<div class="step"><div class="step-head"><strong>${esc(s.name)}</strong><span class="${cls(s.status)}"><b>${esc(s.status)}</b></span></div>${body?`<div class="step-body">${body}</div>`:''}</div>`}
function metadataHtml(m){if(!m||!Object.keys(m).length)return '';return '<div class="metadata">'+Object.entries(m).map(([k,v])=>`<div class="meta"><b>${esc(k)}</b>${esc(v)}</div>`).join('')+'</div>'}

function render(){const rows=DATA;document.getElementById('tests').innerHTML=rows.map(t=>`<div class="test"><div class="test-head" onclick="this.parentElement.classList.toggle('open')"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.nodeid)}</div></div><div><span class="badge ${cls(t.outcome)}">${esc(t.outcome.toUpperCase())}</span> &nbsp; ${Number(t.duration||0).toFixed(2)}s</div></div><div class="test-body">${metadataHtml(t.metadata)}${t.error?`<div class="error">${esc(t.error)}</div>`:''}${(t.logs||[]).length?`<div class="logs"><h3>Console / Print Output</h3>${t.logs.map(l=>`<div class="log-line"><span class="log-level">${esc(l.level)}</span> <span>${esc(l.message)}</span></div>`).join('')}</div>`:''}${(t.steps||[]).map(stepHtml).join('')||'<div class="muted">No custom steps recorded.</div>'}</div></div>`).join('')}
const total=DATA.length,passed=DATA.filter(x=>x.outcome==='passed').length,failed=DATA.filter(x=>x.outcome==='failed').length;document.getElementById('total').textContent=total;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=failed;document.getElementById('rate').textContent=total?((passed/total)*100).toFixed(2)+'%':'0%';render();
</script></body></html>
