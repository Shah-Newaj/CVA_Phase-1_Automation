function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cls(s){return s==='passed'||s==='PASS'?'pass':s==='failed'||s==='FAIL'?'fail':s==='skipped'?'skip':''}
function issueText(issue){
  const parts=[];
  if(issue.type) parts.push(`<b>Type:</b> ${esc(issue.type)}`);
  if(issue.page_name) parts.push(`<b>Page:</b> ${esc(issue.page_name)}`);
  if(issue.element||issue.text) parts.push(`<b>Element/Text:</b> ${esc(issue.element||issue.text)}`);
  if(issue.message) parts.push(`<b>Finding:</b> ${esc(issue.message)}`);
  if(issue.actual!==undefined) parts.push(`<b>Actual:</b> ${esc(issue.actual)}`);
  if(issue.expected!==undefined) parts.push(`<b>Expected:</b> ${esc(issue.expected)}`);
  if(issue.suggestion) parts.push(`<b>Suggestion:</b> ${esc(issue.suggestion)}`);
  if(issue.suggestions&&issue.suggestions.length) parts.push(`<b>Suggestions:</b> ${esc(issue.suggestions.join(', '))}`);
  if(issue.context) parts.push(`<b>Context:</b> ${esc(issue.context)}`);
  if(issue.rule) parts.push(`<b>Rule:</b> ${esc(issue.rule)}`);
  if(issue.url) parts.push(`<b>URL:</b> ${esc(issue.url)}`);
  return parts.join('<br>');
}
function qualityIssues(scan){
  const groups=[
    ['CONTENT / CAPITALIZATION',scan.content_issues||[]],
    ['SPELLING / GRAMMAR',scan.language_issues||[]],
    ['BUTTON / UI CONSISTENCY',scan.ui_issues||[]]
  ];
  return groups.map(([name,issues])=>{
    if(!issues.length)return '';
    return `<div class="issue-group"><h4>${esc(name)} — ${issues.length}</h4>${issues.map((issue,i)=>`
      <div class="issue"><div class="issue-title">Issue ${i+1}</div><div class="issue-detail">${issueText(issue)}</div>
      ${issue.evidence?`<div class="evidence"><div class="muted"><b>Full-page screenshot — highlighted issue location</b></div><img src="${esc(issue.evidence)}" alt="UI quality evidence"></div>`:''}
      </div>`).join('')}</div>`;
  }).join('');
}
function qualityHtml(scans){
  if(!scans||!scans.length)return '';
  const count=(key)=>scans.reduce((total,scan)=>total+(scan[key]||[]).length,0);
  return `<div class="quality-summary"><div class="quality-summary-head">CVA UI QUALITY REPORT — Pages Scanned: ${scans.length}; Total Issues: ${scans.reduce((total,scan)=>total+Number(scan.total_issues||0),0)}</div>
    <div class="quality-page-head" style="padding:12px 16px">
      <span><b>CONTENT / CAPITALIZATION:</b> ${count('content_issues')}</span>
      <span><b>SPELLING / GRAMMAR:</b> ${count('language_issues')}</span>
      <span><b>BUTTON / UI CONSISTENCY:</b> ${count('ui_issues')}</span>
    </div>${scans.map(scan=>`
    <div class="quality-page">
      <div class="quality-page-head"><div><strong>${esc(scan.page_name)}</strong><div class="muted">${esc(scan.url)}</div></div><div><b class="${scan.total_issues?'fail':'pass'}">${scan.total_issues} issue(s)</b> &nbsp; <span class="warn">${(scan.scanner_warnings||[]).length} warning(s)</span></div></div>
      ${qualityIssues(scan)}
      ${(scan.scanner_warnings||[]).length?`<div class="warning-box"><b>Scanner warnings:</b><br>${scan.scanner_warnings.map(w=>esc((w.type||'Warning')+': '+(w.message||''))).join('<br>')}</div>`:''}
      ${!scan.total_issues&&!((scan.scanner_warnings||[]).length)?`<div class="pass" style="margin-top:10px"><b>PASS — no application UI-quality issues detected on this page.</b></div>`:''}
    </div>`).join('')}</div>`;
}
function stepHtml(s){let body='';if(s.details){try{const d=JSON.parse(s.details);if(d.rows){body='<div class="validation-title">Cell-by-cell comparison</div><table><tr><th>Column</th><th>Expected</th><th>Actual</th><th>Status</th></tr>'+d.rows.map(r=>`<tr><td>${esc(r.column)}</td><td>${esc(r.expected)}</td><td>${esc(r.actual)}</td><td class="${cls(r.status)}"><b>${esc(r.status)}</b></td></tr>`).join('')+'</table>'}else body='<div>'+esc(s.details)+'</div>'}catch(e){body='<div>'+esc(s.details)+'</div>'}}
if(s.expected!==null&&s.expected!==undefined) body+=`<table><tr><th>Expected</th><th>Actual</th><th>Status</th></tr><tr><td>${esc(s.expected)}</td><td>${esc(s.actual)}</td><td class="${s.status==='PASS'?'pass':'fail'}"><b>${esc(s.status)}</b></td></tr></table>`;
if(s.screenshot) body+=`<div style="margin-top:12px"><div class="muted" style="font-weight:600;margin-bottom:6px">Failure Screenshot</div><img class="screenshot" src="${esc(s.screenshot)}" alt="Failure Screenshot"></div>`;
return `<div class="step"><div class="step-head"><strong>${esc(s.name)}</strong><span class="${cls(s.status)}"><b>${esc(s.status)}</b></span></div>${body?`<div class="step-body">${body}</div>`:''}</div>`}
function metadataHtml(m){if(!m||!Object.keys(m).length)return '';return '<div class="metadata">'+Object.entries(m).map(([k,v])=>`<div class="meta"><b>${esc(k)}</b>${esc(v)}</div>`).join('')+'</div>'}
function render(){
 const rows=DATA;
 document.getElementById('tests').innerHTML=rows.map(t=>`<div class="test"><div class="test-head" onclick="this.parentElement.classList.toggle('open')"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.nodeid)}</div></div><div><span class="badge ${cls(t.outcome)}">${esc(t.outcome.toUpperCase())}</span> &nbsp; ${Number(t.duration||0).toFixed(2)}s</div></div><div class="test-body">${metadataHtml(t.metadata)}${qualityHtml(t.quality_scans)}${t.error?`<div class="error">${esc(t.error)}</div>`:''}${(t.logs||[]).length?`<div class="logs"><h3>Console / Print Output</h3>${t.logs.map(l=>`<div class="log-line"><span class="log-level">${esc(l.level)}</span> <span>${esc(l.message)}</span></div>`).join('')}</div>`:''}${(t.steps||[]).map(stepHtml).join('')||'<div class="muted">No custom steps recorded.</div>'}</div></div>`).join('');
 const total=DATA.length,passed=DATA.filter(x=>x.outcome==='passed').length,failed=DATA.filter(x=>x.outcome==='failed').length;
 document.getElementById('total').textContent=total;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=failed;document.getElementById('rate').textContent=total?((passed/total)*100).toFixed(2)+'%':'0%';
}
