function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cls(s){return s==='passed'||s==='PASS'?'pass':s==='failed'||s==='FAIL'?'fail':s==='skipped'?'skip':''}
function issueText(issue){
  const parts=[];
  if(issue.type) parts.push(`<b>Type:</b> ${esc(issue.type)}`);
  if(issue.page_name) parts.push(`<b>Page:</b> ${esc(issue.page_name)}`);
  if(issue.element||issue.text) parts.push(`<b>Element/Text:</b> ${esc(issue.element||issue.text)}`);
  if(issue.message) parts.push(`<b>Finding:</b> ${esc(issue.message)}`);
  if(issue.actual!==undefined) parts.push(`<b>Actual:</b> ${esc(issue.actual)}`);
  if(issue.expected!==undefined) parts.push(`<b>Expected:</b> ${esc(issue.expected)}`);
  if(issue.suggestion) parts.push(`<b>Suggestion:</b> ${esc(issue.suggestion)}`);
  if(issue.suggestions&&issue.suggestions.length) parts.push(`<b>Suggestions:</b> ${esc(issue.suggestions.join(', '))}`);
  if(issue.context) parts.push(`<b>Context:</b> ${esc(issue.context)}`);
  if(issue.rule) parts.push(`<b>Rule:</b> ${esc(issue.rule)}`);
  if(issue.url) parts.push(`<b>URL:</b> ${esc(issue.url)}`);
  return parts.join('<br>');
}
function qualityIssues(scan){
  const groups=[
    ['CONTENT / CAPITALIZATION',scan.content_issues||[]],
    ['SPELLING / GRAMMAR',scan.language_issues||[]],
    ['BUTTON / UI CONSISTENCY',scan.ui_issues||[]]
  ];
  return groups.map(([name,issues])=>{
    if(!issues.length)return '';
    return `<div class="issue-group"><h4>${esc(name)} — ${issues.length}</h4>${issues.map((issue,i)=>`
      <div class="issue"><div class="issue-title">Issue ${i+1}</div><div class="issue-detail">${issueText(issue)}</div>
      ${issue.evidence?`<div class="evidence"><div class="muted"><b>Full-page screenshot — highlighted issue location</b></div><img src="${esc(issue.evidence)}" alt="UI quality evidence"></div>`:''}
      </div>`).join('')}</div>`;
  }).join('');
}
function qualityHtml(scans){

  return `<div class="quality-summary"><div class="quality-summary-head">CVA UI QUALITY REPORT — Pages Scanned: ${scans.length}; Total Issues: ${scans.reduce((total,scan)=>total+Number(scan.total_issues||0),0)}</div>

      <span><b>CONTENT / CAPITALIZATION:</b> ${count('content_issues')}</span>

      <span><b>BUTTON / UI CONSISTENCY:</b> ${count('ui_issues')}</span>

}
function stepHtml(s){let body='';if(s.details){try{const d=JSON.parse(s.details);if(d.rows){body='<div class="validation-title">Cell-by-cell comparison</div><table><tr><th>Column</th><th>Expected</th><th>Actual</th><th>Status</th></tr>'+d.rows.map(r=>`<tr><td>${esc(r.column)}</td><td>${esc(r.expected)}</td><td>${esc(r.actual)}</td><td class="${cls(r.status)}"><b>${esc(r.status)}</b></td></tr>`).join('')+'</table>'}else body='<div>'+esc(s.details)+'</div>'}catch(e){body='<div>'+esc(s.details)+'</div>'}}

function metadataHtml(m){if(!m||!Object.keys(m).length)return '';return '<div class="metadata">'+Object.entries(m).map(([k,v])=>`<div class="meta"><b>${esc(k)}</b>${esc(v)}</div>`).join('')+'</div>'}
